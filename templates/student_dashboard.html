<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - AI Hub</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <style>
        .layout { display: grid; grid-template-columns: 350px 1fr; gap: 2rem; margin-top: 2rem; }
        @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
        #calendar { min-height: 500px; }
    </style>
</head>
<body>
    <div class="container">
        <header style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem;">
            <div>
                <h1 style="margin-bottom:0; font-size:2rem; background: -webkit-linear-gradient(#60a5fa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Student Space</h1>
                <p style="margin-top:0.5rem; color:var(--text-secondary);">{{ student.name }} • {{ student.year }} Year • {{ student.dept }} • Div {{ student.div }}</p>
            </div>
            <a href="/student/logout" class="btn" style="background:rgba(255,255,255,0.1); color:white;">Logout</a>
        </header>

        <main class="layout">
            <!-- Sidebar: Face Enrollment -->
            <div style="display:flex; flex-direction:column; gap:1.5rem;">
                <div class="card" style="text-align:center;">
                    <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" width="80" style="margin-bottom:1rem; opacity:0.8;">
                    <h2 style="margin-top:0;">Biometric Profile</h2>
                    
                    {% if has_face %}
                    <div style="background: rgba(16,185,129,0.1); border: 1px solid var(--success); padding: 1rem; border-radius: 8px;">
                        <span style="color:var(--success); font-weight:bold;">✅ Face Enrolled Successfully</span>
                    </div>
                    {% else %}
                    <div style="background: rgba(239,68,68,0.1); border: 1px solid var(--error); padding: 1rem; border-radius: 8px;">
                        <span style="color:var(--error); font-weight:bold;">⚠️ Action Required: Enroll Face</span>
                    </div>
                    {% endif %}

                    <div style="position:relative; margin-top:1.5rem; border-radius:12px; overflow:hidden; background:#000;">
                        <video id="video" autoplay muted playsinline style="width:100%; display:block;"></video>
                        <canvas id="overlay" style="position:absolute; top:0; left:0; width:100%;"></canvas>
                    </div>

                    <button id="captureBtn" class="btn primary-btn" style="margin-top:1rem;" disabled>Loading Scanner...</button>
                    <div id="status" style="margin-top:1rem; font-size:0.9rem; color:var(--text-secondary);"></div>
                </div>
            </div>

            <!-- Main Content: Calendar -->
            <div class="card" style="padding: 1.5rem;">
                <h2 style="margin-top:0; margin-bottom:1.5rem; border-bottom: 1px solid var(--border); padding-bottom:1rem;">My Attendance Calendar</h2>
                <div id='calendar'></div>
            </div>
        </main>
    </div>

    <script>
        // Initialize Calendar
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var eventsData = JSON.parse('{{ calendar_events | safe }}');
            
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'dayGridMonth,timeGridWeek'
                },
                events: eventsData,
                eventContent: function(arg) {
                    return { html: `<div style="text-align:center; padding:2px; font-size:0.85rem;">${arg.event.title}</div>` };
                }
            });
            calendar.render();
        });

        // Camera Logic
        const video = document.getElementById('video');
        const captureBtn = document.getElementById('captureBtn');
        const statusDiv = document.getElementById('status');
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';

        async function initCamera() {
            try {
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    captureBtn.disabled = false;
                    captureBtn.innerText = "Re-Enroll Face";
                    statusDiv.innerText = "Camera Active";
                };
            } catch(e) { statusDiv.innerText = "Error: " + e.message; }
        }

        captureBtn.addEventListener('click', async () => {
            statusDiv.innerText = "Processing biometric data...";
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            if(!detection) { statusDiv.innerText = "Face not detected clearly."; return; }
            if (detection.detection.score < 0.90 || detection.detection.box.width < 100) {
                statusDiv.innerText = "Move closer to the camera and ensure good lighting."; return;
            }

            const response = await fetch('/api/enroll_face', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ encoding: Array.from(detection.descriptor) })
            });
            const result = await response.json();
            if(result.status === 'success') location.reload();
            else statusDiv.innerText = "Failed to save.";
        });
        initCamera();
    </script>
</body>
</html>
