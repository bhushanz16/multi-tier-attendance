<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Edge Inference - Mobile Ready</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        .edge-layout { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
        .video-container { position: relative; width: 100%; max-width: 600px; background: #000; border-radius: 8px; overflow: hidden; }
        video, canvas { width: 100%; height: auto; }
        canvas { position: absolute; top: 0; left: 0; }
        .controls { width: 100%; max-width: 600px; display: flex; gap: 1rem; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Teacher Edge Console</h1>
            <p>Live Classroom Recognition (Mobile Browser)</p>
            <div style="display:flex; justify-content:center; gap: 1rem; margin-top: 0.5rem;">
                <a href="/teacher/dashboard" style="color:var(--text-secondary); text-decoration:none; font-size:0.9rem;">← Back to Dashboard</a>
                <span style="color:var(--border);">|</span>
                <a href="/teacher/logout" style="color:var(--text-secondary); text-decoration:none; font-size:0.9rem;">Logout</a>
            </div>
        </header>

        <main class="edge-layout">
            <div id="status" class="info">Loading Deep Learning Models...</div>
            
            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="overlay"></canvas>
            </div>

            <div class="controls">
                <button id="stopBtn" class="btn primary-btn" style="background-color: var(--error);" disabled>Stop & Sync Attendance</button>
            </div>
            
            <div class="card" style="width:100%; max-width:600px; margin-top:1rem;">
                <h3>Attendance Log (Today)</h3>
                <ul id="logList" style="list-style:none; padding:0; margin:0; max-height:200px; overflow-y:auto; color:var(--text-secondary)">
                </ul>
            </div>
        </main>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const stopBtn = document.getElementById('stopBtn');
        const statusDiv = document.getElementById('status');
        const logList = document.getElementById('logList');
        
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        let faceMatcher = null;
        let running = true;
        let attendanceLog = {}; // map of roll_no -> { name, status }
        let knownStudents = [];

        async function init() {
            try {
                // Fetch student data from server
                statusDiv.innerText = "Fetching classroom rosters...";
                const res = await fetch('/api/students');
                knownStudents = await res.json();
                
                if(knownStudents.length === 0) {
                    statusDiv.innerText = "No students enrolled in database!";
                    statusDiv.className = "error";
                    return;
                }

                // Load models
                statusDiv.innerText = "Loading Neural Networks into browser...";
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                // Create FaceMatcher
                const labeledDescriptors = knownStudents.map(student => {
                    const descArray = new Float32Array(student.face_encoding);
                    // Label format: "RollNo::Name" so we can parse it easily
                    return new faceapi.LabeledFaceDescriptors(`${student.roll_no}::${student.name}`, [descArray]);
                });
                // Using distance threshold 0.5 (smaller is stricter)
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);

                statusDiv.innerText = "Starting Camera...";
                // Prefer back camera for phones if available
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;

                video.onplay = () => {
                    stopBtn.disabled = false;
                    statusDiv.innerText = "Live Edge Inference Running";
                    statusDiv.className = "success";
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    
                    // Pre-populate attendance log with Absent
                    const today = new Date().toISOString().split('T')[0];
                    knownStudents.forEach(s => {
                        attendanceLog[s.roll_no] = { name: s.name, date: today, status: 'Absent' };
                    });
                    renderLog();

                    detectLoop();
                };

            } catch(e) {
                statusDiv.innerText = "Error: " + e.message;
                statusDiv.className = "error";
            }
        }

        async function detectLoop() {
            if(!running || video.paused || video.ended) return;

            const detections = await faceapi.detectAllFaces(video)
                .withFaceLandmarks()
                .withFaceDescriptors();
            
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            const results = resizedDetections.map(d => faceMatcher.findBestMatch(d.descriptor));

            results.forEach((result, i) => {
                const box = resizedDetections[i].detection.box;
                let text = result.label;
                
                if (result.label !== 'unknown') {
                    const [roll, name] = result.label.split('::');
                    text = name;
                    
                    // Mark Present
                    if(attendanceLog[roll].status !== 'Present') {
                        attendanceLog[roll].status = 'Present';
                        renderLog();
                    }
                }

                const drawBox = new faceapi.draw.DrawBox(box, { label: text + ` (${Math.round(result.distance * 100)/100})` });
                drawBox.draw(overlay);
            });

            // Loop
            requestAnimationFrame(detectLoop);
        }

        function renderLog() {
            logList.innerHTML = '';
            Object.values(attendanceLog).forEach(entry => {
                const color = entry.status === 'Present' ? 'var(--success)' : 'var(--error)';
                logList.innerHTML += `<li style="padding:4px 0;"><span style="color:${color};font-weight:bold;">[${entry.status}]</span> ${entry.name}</li>`;
            });
        }

        stopBtn.addEventListener('click', async () => {
            running = false;
            video.srcObject.getTracks().forEach(track => track.stop());
            stopBtn.disabled = true;
            statusDiv.innerText = "Saving & Syncing...";
            statusDiv.className = "info";

            // Prepare CSV Data
            const records = Object.keys(attendanceLog).map(roll_no => {
                return { roll_no: roll_no, date: attendanceLog[roll_no].date, status: attendanceLog[roll_no].status };
            });

            // 1. Download CSV locally (Mobile Storage)
            let csvContent = "data:text/csv;charset=utf-8,roll_no,date,status\n";
            records.forEach(r => {
                csvContent += `${r.roll_no},${r.date},${r.status}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `attendance_${records[0].date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // 2. Sync immediately to Database
            try {
                const response = await fetch('/api/sync_attendance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(records)
                });
                const result = await response.json();
                
                if(result.status === 'success') {
                    statusDiv.innerText = "Sync Complete! Data saved locally and to DB.";
                    statusDiv.className = "success";
                } else {
                    statusDiv.innerText = "Synced failed: " + result.message;
                    statusDiv.className = "error";
                }
            } catch(e) {
                statusDiv.innerText = "Sync failed: " + e.message;
                statusDiv.className = "error";
            }
        });

        init();
    </script>
</body>
</html>
