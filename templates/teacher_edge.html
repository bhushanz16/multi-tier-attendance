<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Edge Terminal - Synapse Sentinel</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
    <style>@layer base{html,body{margin:0;padding:0;background-color:#0b1326;color:#dae2fd;}::-webkit-scrollbar{display:none;}}</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-container": "#006d4a", "on-secondary": "#4a007f", "secondary": "#deb7ff", "error": "#ffb4ab", "primary": "#dbfcff", "inverse-surface": "#dae2fd", "surface-container-lowest": "#060e20", "on-secondary-container": "#d4a5ff", "on-background": "#dae2fd", "surface-container-highest": "#2d3449", "background": "#0b1326", "inverse-primary": "#006970", "on-secondary-fixed-variant": "#680eac", "tertiary-fixed": "#6ffbbe", "surface-container-high": "#222a3d", "surface-container-low": "#131b2e", "on-primary-fixed-variant": "#004f54", "secondary-fixed": "#f1dbff", "surface-dim": "#0b1326", "on-primary": "#00363a", "primary-fixed": "#7df4ff", "on-error": "#690005", "on-surface": "#dae2fd", "surface-tint": "#00dbe9", "tertiary": "#d8ffe7", "on-tertiary-fixed": "#002113", "on-tertiary-fixed-variant": "#005236", "surface-container": "#171f33", "on-primary-container": "#006970", "on-secondary-fixed": "#2d0050", "surface-variant": "#2d3449", "surface-bright": "#31394d", "on-primary-fixed": "#002022", "secondary-container": "#6b13af", "on-tertiary": "#003824", "tertiary-container": "#65f2b5", "surface": "#0b1326", "primary-container": "#00f0ff", "tertiary-fixed-dim": "#4edea3", "on-surface-variant": "#b9cacb", "on-error-container": "#ffdad6", "inverse-on-surface": "#283044", "secondary-fixed-dim": "#deb7ff", "outline-variant": "#3b494b", "primary-fixed-dim": "#00dbe9", "outline": "#849495", "error-container": "#93000a" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-lg": "1rem", "gutter-dense": "0.375rem", "space-md": "0.75rem", "gutter": "0.75rem", "space-sm": "0.5rem", "space-xl": "1.5rem", "margin-compact": "0.5rem", "margin": "1rem", "space-xs": "0.25rem" }, "fontFamily": { "mono-metric-lg": [ "JetBrains Mono" ], "mono-code-sm": [ "JetBrains Mono" ], "body-sm": [ "Inter" ], "headline-sm": [ "Space Grotesk" ], "display-lg": [ "Space Grotesk" ], "body-md": [ "Inter" ], "label-caps": [ "JetBrains Mono" ], "mono-metric-md": [ "JetBrains Mono" ], "headline-lg": [ "Space Grotesk" ], "body-lg": [ "Inter" ] }, "fontSize": { "mono-metric-lg": [ "18px", { "lineHeight": "24px", "letterSpacing": "-0.02em", "fontWeight": "600" } ], "mono-code-sm": [ "11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "400" } ], "body-sm": [ "11px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" } ], "headline-sm": [ "18px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" } ], "display-lg": [ "32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" } ], "body-md": [ "13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" } ], "label-caps": [ "10px", { "lineHeight": "12px", "letterSpacing": "0.08em", "fontWeight": "700" } ], "mono-metric-md": [ "13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "500" } ], "headline-lg": [ "24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "body-lg": [ "15px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400" } ] } } } };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        .video-container { position: relative; width: 100%; border-radius: 4px; overflow: hidden; display: none; background: #000; border: 1px solid rgba(0,240,255,0.4); box-shadow: inset 0 0 20px rgba(0,240,255,0.1); }
        video, canvas { width: 100%; height: auto; display:block; }
        canvas { position: absolute; top: 0; left: 0; }
        .hud-corner { position: absolute; width: 20px; height: 20px; border: 2px solid #00f0ff; }
        .hud-tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .hud-tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .hud-bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .hud-br { bottom: 10px; right: 10px; border-left: none; border-top: none; }
    </style>
</head>
<body class="bg-background font-body-md text-on-surface antialiased">
    <!-- HEADER -->
    <header class="h-14 bg-surface-container-lowest border-b border-surface-container-highest flex items-center justify-between px-space-lg shadow-[0_1px_8px_rgba(0,0,0,0.3)]">
        <div class="flex items-center gap-space-md">
            <span class="material-symbols-outlined text-primary-fixed text-2xl">memory</span>
            <div class="flex flex-col">
                <span class="font-headline-sm text-headline-sm text-primary tracking-tight leading-none">EDGE NODE ORCHESTRATION</span>
                <span class="font-label-caps text-label-caps text-outline uppercase tracking-wider">L1 LOCAL INFERENCE TERMINAL</span>
            </div>
        </div>
        <div class="flex items-center gap-space-md">
            <a href="/teacher/dashboard" class="flex items-center gap-gutter-dense bg-surface-container hover:bg-surface-container-high text-on-surface font-headline-sm text-mono-code-sm px-space-sm py-space-xs rounded-DEFAULT border border-surface-container-highest transition-colors">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                <span>RETURN TO SOC</span>
            </a>
        </div>
    </header>

    <main class="w-full max-w-5xl mx-auto p-space-lg">
        
        <!-- SETUP CARD -->
        <div id="setupDiv" class="bg-surface-container-low rounded-xl p-space-lg shadow-xl border border-surface-container-highest space-y-space-md">
            <div class="flex items-center gap-space-xs border-b border-surface-container-highest pb-space-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-tertiary-container shadow-[0_0_8px_rgba(101,242,181,0.6)]"></span>
                <h2 class="font-headline-sm text-headline-sm text-tertiary-fixed uppercase">Define Target Inference Topology</h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-space-md font-mono-code-sm">
                <div class="flex flex-col gap-1">
                    <label class="text-label-caps text-outline">Target Semester</label>
                    <select id="selSemester" class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-primary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(0,240,255,0.2)] transition-all">
                        {% for y in semesters %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-label-caps text-outline">Topology Dept</label>
                    <select id="selDept" class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-primary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(0,240,255,0.2)] transition-all">
                        {% for d in depts %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-label-caps text-outline">Topology Div</label>
                    <select id="selDiv" class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-primary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(0,240,255,0.2)] transition-all">
                        {% for d in divs %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
                    </select>
                </div>
            </div>

            <div class="flex flex-col gap-1 font-mono-code-sm">
                <label class="text-label-caps text-outline">Inference Subject / Model Sub-Routine</label>
                <input type="text" id="subjectInput" placeholder="e.g. ADVANCED_AI_SYS_01" class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-primary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(0,240,255,0.2)] transition-all">
            </div>

            <button id="startBtn" class="w-full mt-4 flex items-center justify-center gap-space-xs bg-primary-container/10 border border-primary-container text-primary-fixed hover:bg-primary-container hover:text-on-primary-container font-headline-sm text-mono-code-sm py-space-sm rounded-DEFAULT shadow-[0_0_10px_rgba(0,240,255,0.2)] transition-all">
                <span class="material-symbols-outlined text-base">radar</span>
                <span>INITIALIZE EDGE NEURAL NETWORK</span>
            </button>
        </div>

        <!-- CAMERA SYSTEM -->
        <div id="status" class="hidden mb-space-md bg-surface-container-low border border-primary-container/50 text-primary-fixed font-mono-code-sm text-mono-code-sm p-space-sm rounded-DEFAULT text-center shadow-[0_0_12px_rgba(0,240,255,0.2)]">
            [SYS_INIT] Booting Tensor Cores...
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-space-lg">
            
            <div class="lg:col-span-2 space-y-space-md">
                <div class="video-container" id="videoContainer">
                    <div class="hud-corner hud-tl"></div>
                    <div class="hud-corner hud-tr"></div>
                    <div class="hud-corner hud-bl"></div>
                    <div class="hud-corner hud-br"></div>
                    <!-- Status Overlay -->
                    <div class="absolute top-4 left-4 z-10 flex items-center gap-space-xs bg-surface-container-highest/80 backdrop-blur-sm border border-surface-variant rounded-DEFAULT px-space-xs py-0.5 font-mono-code-sm text-label-caps text-primary-fixed">
                        <span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
                        REC / OPTICAL FEED
                    </div>
                    <video id="video" autoplay muted playsinline></video>
                    <canvas id="overlay"></canvas>
                </div>
                
                <button id="stopBtn" class="hidden w-full flex items-center justify-center gap-space-xs bg-error-container/20 border border-error text-error hover:bg-error hover:text-white font-headline-sm text-mono-code-sm py-space-sm rounded-DEFAULT shadow-[0_0_10px_rgba(239,68,68,0.3)] transition-all">
                    <span class="material-symbols-outlined text-base">stop_circle</span>
                    <span>HALT INFERENCE & UPLOAD TO CLOUD SOC</span>
                </button>
            </div>

            <!-- TERMINAL LOG -->
            <div id="logCard" class="hidden bg-surface-container-lowest rounded-xl p-space-md border border-surface-container-highest shadow-inner flex flex-col h-[500px]">
                <div class="flex items-center justify-between pb-gutter-dense border-b border-surface-container-highest/30 text-outline mb-space-xs">
                    <span class="flex items-center gap-gutter text-tertiary-fixed font-label-caps text-label-caps uppercase">
                        <span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span> WAL LOG
                    </span>
                    <span class="font-mono-code-sm text-mono-code-sm" id="displaySubject"></span>
                </div>
                <ul id="logList" class="flex-1 overflow-y-auto space-y-1 font-mono-code-sm text-mono-code-sm text-on-surface-variant">
                    <!-- Logs injected here -->
                </ul>
            </div>
            
        </div>
    </main>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const stopBtn = document.getElementById('stopBtn');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const logList = document.getElementById('logList');
        const setupDiv = document.getElementById('setupDiv');
        const videoContainer = document.getElementById('videoContainer');
        const logCard = document.getElementById('logCard');
        
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        let faceMatcher = null;
        let running = true;
        let attendanceLog = {}; 
        let knownStudents = [];
        let cSemester, cDept, cDiv, cSubject;

        function addTerminalLog(msg, type="INFO") {
            const time = new Date().toISOString().split('T')[1].slice(0,12) + " UTC";
            let typeColor = "text-tertiary-fixed";
            if(type === "ALERT") typeColor = "text-primary-container";
            if(type === "ERR") typeColor = "text-error";

            const li = document.createElement('li');
            li.className = "flex gap-space-sm border-b border-surface-container-highest/20 pb-1";
            li.innerHTML = `
                <span class="text-outline shrink-0">${time}</span>
                <span class="${typeColor} shrink-0">[${type}]</span>
                <span class="text-on-surface truncate">${msg}</span>
            `;
            logList.insertBefore(li, logList.firstChild);
        }

        startBtn.addEventListener('click', () => {
            cSemester = document.getElementById('selSemester').value;
            cDept = document.getElementById('selDept').value;
            cDiv = document.getElementById('selDiv').value;
            cSubject = document.getElementById('subjectInput').value.trim();

            if(!cSemester || !cDept || !cDiv || !cSubject) {
                alert("ERR: Missing telemetry parameters."); return;
            }

            setupDiv.style.display = 'none';
            statusDiv.style.display = 'block';
            videoContainer.style.display = 'block';
            stopBtn.style.display = 'flex';
            logCard.style.display = 'flex';
            document.getElementById('displaySubject').innerText = `TARGET: ${cSubject}`;
            
            init();
        });

        async function init() {
            try {
                statusDiv.innerText = `[SYS] Requesting topology parameters for ${cSemester}-${cDept}-${cDiv}...`;
                const res = await fetch(`/api/students/${cSemester}/${cDept}/${cDiv}`);
                knownStudents = await res.json();
                
                if(knownStudents.length === 0) {
                    statusDiv.innerText = "[ERR] Null dataset returned for target topology.";
                    statusDiv.className = "mb-space-md bg-error-container/20 border border-error text-error font-mono-code-sm text-mono-code-sm p-space-sm rounded-DEFAULT text-center";
                    return;
                }

                statusDiv.innerText = "[SYS] Allocating VRAM & Loading Models...";
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                addTerminalLog(`Loaded ${knownStudents.length} entity vectors into RAM.`, "INFO");

                const labeledDescriptors = knownStudents.map(student => {
                    const descArray = new Float32Array(student.face_encoding);
                    return new faceapi.LabeledFaceDescriptors(`${student.roll_no}::${student.name}`, [descArray]);
                });
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45); // Stricter threshold for SOC

                statusDiv.innerText = "[SYS] Mounting Optical Sensor...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;

                video.onplay = () => {
                    statusDiv.innerText = "[OK] Edge Inference Runtime Active. Liveness Engine Online.";
                    statusDiv.className = "mb-space-md bg-tertiary-container/10 border border-tertiary-container/50 text-tertiary-fixed font-mono-code-sm text-mono-code-sm p-space-sm rounded-DEFAULT text-center";
                    
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    
                    const today = new Date().toISOString().split('T')[0];
                    knownStudents.forEach(s => {
                        attendanceLog[s.roll_no] = { name: s.name, date: today, status: 'Absent' };
                    });
                    addTerminalLog("Sensor active. Awaiting targets.", "INFO");
                    detectLoop();
                };

            } catch(e) {
                statusDiv.innerText = "[FATAL] " + e.message;
            }
        }

        async function detectLoop() {
            if(!running || video.paused || video.ended) return;

            const detections = await faceapi.detectAllFaces(video)
                .withFaceLandmarks()
                .withFaceDescriptors();
            
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            const results = resizedDetections.map(d => faceMatcher.findBestMatch(d.descriptor));

            results.forEach((result, i) => {
                const box = resizedDetections[i].detection.box;
                let text = result.label;
                let color = 'rgba(0, 240, 255, 1)'; // Cyan for known
                let bgColor = 'rgba(7, 10, 17, 0.85)';
                
                if (result.label !== 'unknown') {
                    const [roll, name] = result.label.split('::');
                    text = name;
                    
                    if(attendanceLog[roll].status !== 'Present') {
                        attendanceLog[roll].status = 'Present';
                        addTerminalLog(`Entity Confirmed: ${name} (ID: ${roll}) [Conf: ${Math.round((1-result.distance)*100)}%]`, "ALERT");
                    }
                } else {
                    color = 'rgba(239, 68, 68, 1)'; // Red for unknown
                    text = 'UNRECOGNIZED_ENTITY';
                }

                const drawBox = new faceapi.draw.DrawBox(box, { 
                    label: text,
                    lineWidth: 2,
                    boxColor: color,
                    drawLabelOptions: {
                        anchorPosition: 'TOP_RIGHT',
                        backgroundColor: bgColor,
                        fontColor: color,
                        fontSize: 10,
                        padding: 4
                    }
                });
                drawBox.draw(overlay);
            });

            requestAnimationFrame(detectLoop);
        }

        stopBtn.addEventListener('click', async () => {
            running = false;
            video.srcObject.getTracks().forEach(track => track.stop());
            stopBtn.disabled = true;
            statusDiv.innerText = "[SYS] Packing Data & Executing Cloud Sync via RPC...";
            addTerminalLog("HALTING SENSOR. Packing DELTA CSV...", "INFO");

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                            now.getMinutes().toString().padStart(2, '0') + ":" + 
                            now.getSeconds().toString().padStart(2, '0');

            const records = Object.keys(attendanceLog).map(roll_no => {
                return { 
                    roll_no: roll_no, date: attendanceLog[roll_no].date, time: timeStr,
                    subject: cSubject, semester: cSemester, dept: cDept, div: cDiv,
                    status: attendanceLog[roll_no].status 
                };
            });

            // API Sync
            try {
                const response = await fetch('/api/sync_attendance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(records)
                });
                const result = await response.json();
                if(result.status === 'success') {
                    statusDiv.innerText = "[OK] Delta Sync to Central Cloud Successful. Safe to Exit.";
                    addTerminalLog("SYNC SUCCESS. Master DB Updated.", "INFO");
                }
            } catch(e) {
                statusDiv.innerText = "[ERR] Sync failed: " + e.message;
            }
        });
    </script>
</body>
</html>
