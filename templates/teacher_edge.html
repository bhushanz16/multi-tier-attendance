<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Edge Inference - Mobile Ready</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        .edge-layout { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
        .video-container { position: relative; width: 100%; max-width: 600px; background: #000; border-radius: 8px; overflow: hidden; display: none; }
        video, canvas { width: 100%; height: auto; }
        canvas { position: absolute; top: 0; left: 0; }
        .controls { width: 100%; max-width: 600px; display: none; gap: 1rem; margin-top: 1rem; }
        .setup-card { background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 600px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Teacher Edge Console</h1>
            <p>Live Classroom Recognition</p>
            <div style="display:flex; justify-content:center; gap: 1rem; margin-top: 0.5rem;">
                <a href="/teacher/dashboard" style="color:var(--text-secondary); text-decoration:none; font-size:0.9rem;">← Back to Dashboard</a>
                <span style="color:var(--border);">|</span>
                <a href="/teacher/logout" style="color:var(--text-secondary); text-decoration:none; font-size:0.9rem;">Logout</a>
            </div>
        </header>

        <main class="edge-layout">
            
            <div id="setupDiv" class="setup-card">
                <h3 style="margin-top:0;">Start a Lecture</h3>
                <div class="input-group">
                    <label>Select Class</label>
                    <select id="classSelect" class="styled-input" style="width: 100%; padding: 0.8rem; background: var(--bg-color); color: white; border: 1px solid var(--border); border-radius: 8px;">
                        <option value="" disabled selected>-- Select Class --</option>
                        {% for c in classes %}
                        <option value="{{ c }}">{{ c }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="input-group">
                    <label>Enter Subject Name</label>
                    <input type="text" id="subjectInput" placeholder="e.g. Data Structures" style="width: 100%; padding: 0.8rem; background: var(--bg-color); color: white; border: 1px solid var(--border); border-radius: 8px;">
                </div>
                <button id="startBtn" class="btn primary-btn" style="width: 100%; margin-top: 1rem;">Launch Scanner</button>
            </div>

            <div id="status" class="info" style="display:none;">Loading Deep Learning Models...</div>
            
            <div class="video-container" id="videoContainer">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="overlay"></canvas>
            </div>

            <div class="controls" id="controlsDiv">
                <button id="stopBtn" class="btn primary-btn" style="background-color: var(--error);" disabled>Stop & Sync Attendance</button>
            </div>
            
            <div class="card" id="logCard" style="width:100%; max-width:600px; margin-top:1rem; display:none;">
                <h3 style="margin-top:0;">Live Roster: <span id="displaySubject" style="color:var(--accent);"></span></h3>
                <ul id="logList" style="list-style:none; padding:0; margin:0; max-height:200px; overflow-y:auto; color:var(--text-secondary)">
                </ul>
            </div>
        </main>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const stopBtn = document.getElementById('stopBtn');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const logList = document.getElementById('logList');
        const setupDiv = document.getElementById('setupDiv');
        const videoContainer = document.getElementById('videoContainer');
        const controlsDiv = document.getElementById('controlsDiv');
        const logCard = document.getElementById('logCard');
        
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        let faceMatcher = null;
        let running = true;
        let attendanceLog = {}; // map of roll_no -> { name, status }
        let knownStudents = [];
        let currentClass = "";
        let currentSubject = "";

        startBtn.addEventListener('click', () => {
            currentClass = document.getElementById('classSelect').value;
            currentSubject = document.getElementById('subjectInput').value.trim();

            if(!currentClass || !currentSubject) {
                alert("Please select a class and enter a subject.");
                return;
            }

            setupDiv.style.display = 'none';
            statusDiv.style.display = 'block';
            videoContainer.style.display = 'block';
            controlsDiv.style.display = 'flex';
            logCard.style.display = 'block';
            document.getElementById('displaySubject').innerText = currentSubject + " (" + currentClass + ")";
            
            init();
        });

        async function init() {
            try {
                statusDiv.innerText = "Fetching " + currentClass + " rosters...";
                const res = await fetch('/api/students/' + encodeURIComponent(currentClass));
                knownStudents = await res.json();
                
                if(knownStudents.length === 0) {
                    statusDiv.innerText = "No students enrolled in this class yet!";
                    statusDiv.className = "error";
                    return;
                }

                statusDiv.innerText = "Loading Neural Networks into browser...";
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                const labeledDescriptors = knownStudents.map(student => {
                    const descArray = new Float32Array(student.face_encoding);
                    return new faceapi.LabeledFaceDescriptors(`${student.roll_no}::${student.name}`, [descArray]);
                });
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);

                statusDiv.innerText = "Starting Camera...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;

                video.onplay = () => {
                    stopBtn.disabled = false;
                    statusDiv.innerText = "Live Edge Inference Running";
                    statusDiv.className = "success";
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    
                    const today = new Date().toISOString().split('T')[0];
                    knownStudents.forEach(s => {
                        attendanceLog[s.roll_no] = { name: s.name, date: today, status: 'Absent' };
                    });
                    renderLog();
                    detectLoop();
                };

            } catch(e) {
                statusDiv.innerText = "Error: " + e.message;
                statusDiv.className = "error";
            }
        }

        async function detectLoop() {
            if(!running || video.paused || video.ended) return;

            const detections = await faceapi.detectAllFaces(video)
                .withFaceLandmarks()
                .withFaceDescriptors();
            
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            const results = resizedDetections.map(d => faceMatcher.findBestMatch(d.descriptor));

            results.forEach((result, i) => {
                const box = resizedDetections[i].detection.box;
                let text = result.label;
                
                if (result.label !== 'unknown') {
                    const [roll, name] = result.label.split('::');
                    text = name;
                    
                    if(attendanceLog[roll].status !== 'Present') {
                        attendanceLog[roll].status = 'Present';
                        renderLog();
                    }
                }

                const drawBox = new faceapi.draw.DrawBox(box, { label: text + ` (${Math.round(result.distance * 100)/100})` });
                drawBox.draw(overlay);
            });

            requestAnimationFrame(detectLoop);
        }

        function renderLog() {
            logList.innerHTML = '';
            Object.values(attendanceLog).forEach(entry => {
                const color = entry.status === 'Present' ? 'var(--success)' : 'var(--error)';
                logList.innerHTML += `<li style="padding:4px 0;"><span style="color:${color};font-weight:bold;">[${entry.status}]</span> ${entry.name}</li>`;
            });
        }

        stopBtn.addEventListener('click', async () => {
            running = false;
            video.srcObject.getTracks().forEach(track => track.stop());
            stopBtn.disabled = true;
            statusDiv.innerText = "Saving & Syncing...";
            statusDiv.className = "info";

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                            now.getMinutes().toString().padStart(2, '0') + ":" + 
                            now.getSeconds().toString().padStart(2, '0');

            const records = Object.keys(attendanceLog).map(roll_no => {
                return { 
                    roll_no: roll_no, 
                    date: attendanceLog[roll_no].date, 
                    time: timeStr,
                    subject: currentSubject,
                    class_name: currentClass,
                    status: attendanceLog[roll_no].status 
                };
            });

            let csvContent = "data:text/csv;charset=utf-8,roll_no,date,time,subject,class_name,status\n";
            records.forEach(r => {
                csvContent += `${r.roll_no},${r.date},${r.time},${r.subject},${r.class_name},${r.status}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${currentClass}_${currentSubject}_${records[0].date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            try {
                const response = await fetch('/api/sync_attendance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(records)
                });
                const result = await response.json();
                
                if(result.status === 'success') {
                    statusDiv.innerText = "Sync Complete! Data saved locally and to Advanced DB.";
                    statusDiv.className = "success";
                } else {
                    statusDiv.innerText = "Synced failed: " + result.message;
                    statusDiv.className = "error";
                }
            } catch(e) {
                statusDiv.innerText = "Sync failed: " + e.message;
                statusDiv.className = "error";
            }
        });
    </script>
</body>
</html>
