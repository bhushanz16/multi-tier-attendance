<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Edge Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <style>
        .edge-layout { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
        .video-container { position: relative; width: 100%; max-width: 600px; background: #000; border-radius: 12px; overflow: hidden; display: none; border:2px solid var(--accent);}
        video, canvas { width: 100%; height: auto; display:block;}
        canvas { position: absolute; top: 0; left: 0; }
        .setup-card { background: var(--card-bg); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 600px; }
    </style>
</head>
<body>
    <div class="container">
        <header style="text-align:center;">
            <h1 style="background: -webkit-linear-gradient(#f59e0b, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Live Edge Scanner</h1>
            <a href="/teacher/dashboard" style="color:var(--text-secondary); text-decoration:none;">← Back to Admin Panel</a>
        </header>

        <main class="edge-layout">
            <div id="setupDiv" class="setup-card">
                <h2 style="margin-top:0; border-bottom:1px solid var(--border); padding-bottom:1rem;">Target Audience</h2>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1rem;">
                    <div class="input-group">
                        <label>Semester</label>
                        <select id="selSemester">
                            {% for y in semesters %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Dept</label>
                        <select id="selDept">
                            {% for d in depts %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Div</label>
                        <select id="selDiv">
                            {% for d in divs %}<option value="{{ d }}">{{ d }}</option>{% endfor %}
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label>Lecture Subject</label>
                    <input type="text" id="subjectInput" placeholder="e.g. Advanced AI" required>
                </div>
                <button id="startBtn" class="btn primary-btn" style="height:50px; font-size:1.1rem; background: linear-gradient(90deg, #3b82f6, #8b5cf6);">🚀 Initialize Neural Networks</button>
            </div>

            <div id="status" class="card" style="display:none; width:100%; max-width:600px; text-align:center; color:var(--accent); font-weight:bold;">Loading Deep Learning Models...</div>
            
            <div class="video-container" id="videoContainer">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="overlay"></canvas>
            </div>

            <button id="stopBtn" class="btn primary-btn" style="background-color: var(--error); width:100%; max-width:600px; display:none; height:60px; font-size:1.2rem;">⏹ Stop Camera & Sync Data</button>
            
            <div class="card" id="logCard" style="width:100%; max-width:600px; display:none;">
                <h3 style="margin-top:0; border-bottom:1px solid var(--border); padding-bottom:1rem;">Live Roster: <span id="displaySubject" style="color:var(--accent);"></span></h3>
                <ul id="logList" style="list-style:none; padding:0; margin:0; max-height:250px; overflow-y:auto; color:var(--text-secondary)">
                </ul>
            </div>
        </main>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const stopBtn = document.getElementById('stopBtn');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');
        const logList = document.getElementById('logList');
        const setupDiv = document.getElementById('setupDiv');
        const videoContainer = document.getElementById('videoContainer');
        const logCard = document.getElementById('logCard');
        
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        let faceMatcher = null;
        let running = true;
        let attendanceLog = {}; 
        let knownStudents = [];
        let cSemester, cDept, cDiv, cSubject;

        startBtn.addEventListener('click', () => {
            cSemester = document.getElementById('selSemester').value;
            cDept = document.getElementById('selDept').value;
            cDiv = document.getElementById('selDiv').value;
            cSubject = document.getElementById('subjectInput').value.trim();

            if(!cSemester || !cDept || !cDiv || !cSubject) {
                alert("Please fill all target fields."); return;
            }

            setupDiv.style.display = 'none';
            statusDiv.style.display = 'block';
            videoContainer.style.display = 'block';
            stopBtn.style.display = 'block';
            logCard.style.display = 'block';
            document.getElementById('displaySubject').innerText = `${cSubject} (${cSemester}-${cDept}-${cDiv})`;
            
            init();
        });

        async function init() {
            try {
                statusDiv.innerText = `Fetching ${cSemester} ${cDept} Div ${cDiv} rosters...`;
                const res = await fetch(`/api/students/${cSemester}/${cDept}/${cDiv}`);
                knownStudents = await res.json();
                
                if(knownStudents.length === 0) {
                    statusDiv.innerText = "No students enrolled in this specific division yet!";
                    statusDiv.style.color = "var(--error)";
                    return;
                }

                statusDiv.innerText = "Loading Neural Networks into browser...";
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                const labeledDescriptors = knownStudents.map(student => {
                    const descArray = new Float32Array(student.face_encoding);
                    return new faceapi.LabeledFaceDescriptors(`${student.roll_no}::${student.name}`, [descArray]);
                });
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.5);

                statusDiv.innerText = "Starting Camera...";
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;

                video.onplay = () => {
                    statusDiv.innerText = "Live Edge Inference Running (Processing local feed...)";
                    statusDiv.style.color = "var(--success)";
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    
                    const today = new Date().toISOString().split('T')[0];
                    knownStudents.forEach(s => {
                        attendanceLog[s.roll_no] = { name: s.name, date: today, status: 'Absent' };
                    });
                    renderLog();
                    detectLoop();
                };

            } catch(e) {
                statusDiv.innerText = "Error: " + e.message;
            }
        }

        async function detectLoop() {
            if(!running || video.paused || video.ended) return;

            const detections = await faceapi.detectAllFaces(video)
                .withFaceLandmarks()
                .withFaceDescriptors();
            
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            const results = resizedDetections.map(d => faceMatcher.findBestMatch(d.descriptor));

            results.forEach((result, i) => {
                const box = resizedDetections[i].detection.box;
                let text = result.label;
                
                if (result.label !== 'unknown') {
                    const [roll, name] = result.label.split('::');
                    text = name;
                    
                    if(attendanceLog[roll].status !== 'Present') {
                        attendanceLog[roll].status = 'Present';
                        renderLog();
                    }
                }

                const drawBox = new faceapi.draw.DrawBox(box, { label: text + ` (${Math.round(result.distance * 100)/100})` });
                drawBox.draw(overlay);
            });

            requestAnimationFrame(detectLoop);
        }

        function renderLog() {
            logList.innerHTML = '';
            Object.values(attendanceLog).forEach(entry => {
                const color = entry.status === 'Present' ? 'var(--success)' : 'var(--error)';
                logList.innerHTML += `<li style="padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span style="color:${color};font-weight:bold; background:rgba(255,255,255,0.05); padding:2px 8px; border-radius:4px; margin-right:10px;">[${entry.status}]</span> ${entry.name}</li>`;
            });
        }

        stopBtn.addEventListener('click', async () => {
            running = false;
            video.srcObject.getTracks().forEach(track => track.stop());
            stopBtn.disabled = true;
            statusDiv.innerText = "Saving & Syncing to Cloud...";

            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + 
                            now.getMinutes().toString().padStart(2, '0') + ":" + 
                            now.getSeconds().toString().padStart(2, '0');

            const records = Object.keys(attendanceLog).map(roll_no => {
                return { 
                    roll_no: roll_no, 
                    date: attendanceLog[roll_no].date, 
                    time: timeStr,
                    subject: cSubject,
                    semester: cSemester,
                    dept: cDept,
                    div: cDiv,
                    status: attendanceLog[roll_no].status 
                };
            });

            // CSV Download
            let csvContent = "data:text/csv;charset=utf-8,roll_no,date,time,subject,semester,dept,div,status\n";
            records.forEach(r => { csvContent += `${r.roll_no},${r.date},${r.time},${r.subject},${r.semester},${r.dept},${r.div},${r.status}\n`; });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `${cSemester}_${cDept}_${cDiv}_${cSubject}_${records[0].date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // API Sync
            try {
                const response = await fetch('/api/sync_attendance', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(records)
                });
                const result = await response.json();
                if(result.status === 'success') {
                    statusDiv.innerText = "Sync Complete! Data saved locally and to Cloud DB.";
                    statusDiv.style.color = "var(--success)";
                }
            } catch(e) {
                statusDiv.innerText = "Sync failed: " + e.message;
            }
        });
    </script>
</body>
</html>
