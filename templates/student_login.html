<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - AI Hub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Portal</h1>
            <p>Login to manage your profile</p>
        </header>

        <main class="enroll-card">
            <form action="/student/login" method="POST">
                <div class="input-group">
                    <label for="roll_no">Roll Number</label>
                    <input type="text" id="roll_no" name="roll_no" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn primary-btn" style="background-color: var(--success);">Login</button>
            </form>
            
            <p style="text-align:center; margin-top:20px;">
                Don't have an account? <a href="/student/register" style="color:var(--success);">Register here</a>
            </p>
            <div style="text-align:center; margin-top: 2rem;">
                <a href="/" style="color:var(--text-secondary);">← Back to Home</a>
            </div>
        </main>
    </div>
</body>
</html>
