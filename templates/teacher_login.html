<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - AI Hub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Teacher Portal</h1>
            <p>Login to access Edge Inference Console</p>
        </header>

        <main class="enroll-card">
            <form action="/teacher/login" method="POST">
                <div class="input-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required value="admin">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required value="password">
                </div>
                <button type="submit" class="btn primary-btn">Login</button>
            </form>
            <p style="text-align:center; margin-top:10px; color:#94a3b8">Default trial credentials: admin / password</p>
            <div style="text-align:center; margin-top: 2rem;">
                <a href="/" style="color:var(--text-secondary);">← Back to Home</a>
            </div>
        </main>
    </div>
</body>
</html>
