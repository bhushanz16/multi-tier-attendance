<!DOCTYPE html>

<body class="bg-background font-body-md text-on-surface antialiased flex items-center justify-center min-h-screen relative overflow-hidden">
    <!-- Background Decor -->
    <div class="absolute -right-20 -top-20 w-96 h-96 bg-primary-container/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -left-20 -bottom-20 w-80 h-80 bg-secondary-container/15 rounded-full blur-3xl pointer-events-none"></div>
    
    <div class="w-full max-w-4xl p-space-lg relative z-10">
        <div class="flex flex-col items-center text-center space-y-space-md mb-space-xl">
            <div class="flex items-center justify-center gap-space-sm font-label-caps text-label-caps text-primary-fixed-dim bg-surface-container-low px-space-sm py-gutter-dense rounded-DEFAULT border border-primary-container/30">
                <span class="w-2 h-2 rounded-full bg-primary-container animate-pulse shadow-[0_0_8px_rgba(0,240,255,0.7)]"></span>
                <span>SYSTEM ONLINE: CONNECTED TO CLOUD</span>
            </div>
            
            <h1 class="font-display-lg text-[48px] font-bold tracking-tight text-white leading-none">ATTENDANCE HUB</h1>
            <p class="font-mono-code-sm text-outline tracking-wider uppercase max-w-xl mx-auto">
                Smart Biometric Attendance System. Select your portal below.
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-space-lg">
            
            <!-- Student Portal Link -->
            <a href="/student/login" class="group relative bg-surface-container-lowest rounded-xl p-space-lg border border-surface-container-highest hover:border-secondary transition-all shadow-xl" style="text-decoration:none;">
                <div class="absolute inset-0 bg-secondary-container/5 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl"></div>
                <div class="relative z-10 flex flex-col items-center text-center space-y-space-md">
                    <div class="w-16 h-16 rounded-full bg-secondary-container/20 flex items-center justify-center">
                        <span class="material-symbols-outlined text-secondary-fixed text-3xl">fingerprint</span>
                    </div>
                    <div>
                        <h2 class="font-headline-sm text-headline-sm text-secondary-fixed mb-1">Student Portal</h2>
                        <p class="font-body-sm text-body-sm text-on-surface-variant">View your attendance and register your face.</p>
                    </div>
                </div>
            </a>

            <!-- Teacher Portal Link -->
            <a href="/teacher/login" class="group relative bg-surface-container-lowest rounded-xl p-space-lg border border-surface-container-highest hover:border-primary transition-all shadow-xl" style="text-decoration:none;">
                <div class="absolute inset-0 bg-primary-container/5 opacity-0 group-hover:opacity-100 transition-opacity rounded-xl"></div>
                <div class="relative z-10 flex flex-col items-center text-center space-y-space-md">
                    <div class="w-16 h-16 rounded-full bg-primary-container/20 flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary-fixed text-3xl">admin_panel_settings</span>
                    </div>
                    <div>
                        <h2 class="font-headline-sm text-headline-sm text-primary-fixed mb-1">Teacher Portal</h2>
                        <p class="font-body-sm text-body-sm text-on-surface-variant">Manage attendance records and start the face scanner.</p>
                    </div>
                </div>
            </a>

        </div>
    </div>

</html>
