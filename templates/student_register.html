<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Student Registration - Attendance Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
    <style>@layer base{html,body{margin:0;padding:0;background-color:#0b1326;color:#dae2fd;}::-webkit-scrollbar{display:none;}}</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-tertiary-container": "#006d4a", "on-secondary": "#4a007f", "secondary": "#deb7ff", "error": "#ffb4ab", "primary": "#dbfcff", "inverse-surface": "#dae2fd", "surface-container-lowest": "#060e20", "on-secondary-container": "#d4a5ff", "on-background": "#dae2fd", "surface-container-highest": "#2d3449", "background": "#0b1326", "inverse-primary": "#006970", "on-secondary-fixed-variant": "#680eac", "tertiary-fixed": "#6ffbbe", "surface-container-high": "#222a3d", "surface-container-low": "#131b2e", "on-primary-fixed-variant": "#004f54", "secondary-fixed": "#f1dbff", "surface-dim": "#0b1326", "on-primary": "#00363a", "primary-fixed": "#7df4ff", "on-error": "#690005", "on-surface": "#dae2fd", "surface-tint": "#00dbe9", "tertiary": "#d8ffe7", "on-tertiary-fixed": "#002113", "on-tertiary-fixed-variant": "#005236", "surface-container": "#171f33", "on-primary-container": "#006970", "on-secondary-fixed": "#2d0050", "surface-variant": "#2d3449", "surface-bright": "#31394d", "on-primary-fixed": "#002022", "secondary-container": "#6b13af", "on-tertiary": "#003824", "tertiary-container": "#65f2b5", "surface": "#0b1326", "primary-container": "#00f0ff", "tertiary-fixed-dim": "#4edea3", "on-surface-variant": "#b9cacb", "on-error-container": "#ffdad6", "inverse-on-surface": "#283044", "secondary-fixed-dim": "#deb7ff", "outline-variant": "#3b494b", "primary-fixed-dim": "#00dbe9", "outline": "#849495", "error-container": "#93000a" }, "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" }, "spacing": { "space-lg": "1rem", "gutter-dense": "0.375rem", "space-md": "0.75rem", "gutter": "0.75rem", "space-sm": "0.5rem", "space-xl": "1.5rem", "margin-compact": "0.5rem", "margin": "1rem", "space-xs": "0.25rem" }, "fontFamily": { "mono-metric-lg": [ "JetBrains Mono" ], "mono-code-sm": [ "JetBrains Mono" ], "body-sm": [ "Inter" ], "headline-sm": [ "Space Grotesk" ], "display-lg": [ "Space Grotesk" ], "body-md": [ "Inter" ], "label-caps": [ "JetBrains Mono" ], "mono-metric-md": [ "JetBrains Mono" ], "headline-lg": [ "Space Grotesk" ], "body-lg": [ "Inter" ] }, "fontSize": { "mono-metric-lg": [ "18px", { "lineHeight": "24px", "letterSpacing": "-0.02em", "fontWeight": "600" } ], "mono-code-sm": [ "11px", { "lineHeight": "14px", "letterSpacing": "0.02em", "fontWeight": "400" } ], "body-sm": [ "11px", { "lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "400" } ], "headline-sm": [ "18px", { "lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "600" } ], "display-lg": [ "32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700" } ], "body-md": [ "13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "400" } ], "label-caps": [ "10px", { "lineHeight": "12px", "letterSpacing": "0.08em", "fontWeight": "700" } ], "mono-metric-md": [ "13px", { "lineHeight": "18px", "letterSpacing": "0em", "fontWeight": "500" } ], "headline-lg": [ "24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" } ], "body-lg": [ "15px", { "lineHeight": "22px", "letterSpacing": "-0.005em", "fontWeight": "400" } ] } } } };
    </script>
</head>
<body class="bg-background font-body-md text-on-surface antialiased flex items-center justify-center min-h-screen relative overflow-hidden py-10">
    <div class="absolute -right-20 -top-20 w-96 h-96 bg-secondary-container/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-2xl p-space-lg relative z-10">
        <div class="bg-surface-container-lowest rounded-xl p-space-xl border border-surface-container-highest shadow-xl">
            <div class="flex flex-col items-center mb-space-lg text-center border-b border-surface-container-highest pb-space-md">
                <span class="material-symbols-outlined text-secondary-fixed text-4xl mb-2">person_add</span>
                <h1 class="font-headline-lg text-headline-lg text-secondary-fixed tracking-tight">Student Registration</h1>
                <p class="font-mono-code-sm text-outline tracking-wider mt-1">CREATE YOUR ACCOUNT</p>
            </div>

            <form action="/student/register" method="POST" class="space-y-space-md">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-space-md">
                    <div class="flex flex-col gap-1 font-mono-code-sm">
                        <label class="text-label-caps text-outline">Roll Number</label>
                        <input type="text" name="roll_no" required class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-secondary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(107,19,175,0.2)] transition-all">
                    </div>
                    <div class="flex flex-col gap-1 font-mono-code-sm">
                        <label class="text-label-caps text-outline">Full Name</label>
                        <input type="text" name="name" required class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-secondary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(107,19,175,0.2)] transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-space-md bg-surface-container-low p-space-md rounded-lg border border-surface-container">
                    <div class="flex flex-col gap-1 font-mono-code-sm">
                        <label class="text-label-caps text-outline">Semester</label>
                        <select name="semester" required class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-secondary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(107,19,175,0.2)] transition-all">
                            <option value="Semester 1">Semester 1</option>
                            <option value="Semester 2">Semester 2</option>
                            <option value="Semester 3">Semester 3</option>
                            <option value="Semester 4">Semester 4</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1 font-mono-code-sm">
                        <label class="text-label-caps text-outline">Department</label>
                        <select name="dept" required class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-secondary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(107,19,175,0.2)] transition-all">
                            <option value="Computer">Computer</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                            <option value="Electrical">Electrical</option>
                            <option value="AI/DS">AI/DS</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1 font-mono-code-sm">
                        <label class="text-label-caps text-outline">Class Division</label>
                        <select name="div" required class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-secondary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(107,19,175,0.2)] transition-all">
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                        </select>
                    </div>
                </div>

                <div class="flex flex-col gap-1 font-mono-code-sm">
                    <label class="text-label-caps text-outline">Password</label>
                    <input type="password" name="password" required class="bg-surface-container text-on-surface border border-surface-container-highest rounded-DEFAULT px-space-sm py-2 focus:border-secondary-container focus:outline-none focus:shadow-[inset_0_0_4px_rgba(107,19,175,0.2)] transition-all">
                </div>
                
                <button type="submit" class="w-full mt-4 flex items-center justify-center gap-space-xs bg-tertiary-container/10 border border-tertiary text-tertiary-fixed hover:bg-tertiary-container hover:text-on-tertiary-container font-headline-sm text-mono-code-sm py-space-sm rounded-DEFAULT shadow-[0_0_10px_rgba(101,242,181,0.2)] transition-all">
                    <span>REGISTER ACCOUNT</span>
                </button>
            </form>
            <div class="mt-4 text-center space-y-2">
                <div><a href="/student/login" class="text-secondary-fixed hover:text-white font-mono-code-sm text-mono-code-sm"><- Back to Login</a></div>
            </div>
        </div>
    </div>
</body>
</html>
