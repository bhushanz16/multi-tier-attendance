<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - AI Hub</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="manifest" href="/static/manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student Registration</h1>
            <p>Create your account</p>
        </header>

        <main class="enroll-card">
            <form action="/student/register" method="POST">
                <div class="input-group">
                    <label for="roll_no">Roll Number</label>
                    <input type="text" id="roll_no" name="roll_no" required>
                </div>
                <div class="input-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="input-group">
                    <label for="class_name">Class / Semester</label>
                    <input type="text" id="class_name" name="class_name" placeholder="e.g. CS-A or Semester 3" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn primary-btn" style="background-color: var(--success);">Register</button>
            </form>
            
            <p style="text-align:center; margin-top:20px;">
                Already have an account? <a href="/student/login" style="color:var(--success);">Login here</a>
            </p>
        </main>
    </div>
</body>
</html>
