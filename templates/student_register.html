<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - AI Hub</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 style="background: -webkit-linear-gradient(#60a5fa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Student Registration</h1>
            <p>Create your biometric profile</p>
        </header>

        <main class="card" style="max-width: 600px; margin: 0 auto;">
            <form action="/student/register" method="POST">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:1rem;">
                    <div class="input-group">
                        <label for="roll_no">Roll Number</label>
                        <input type="text" id="roll_no" name="roll_no" required>
                    </div>
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:1rem;">
                    <div class="input-group">
                        <label>Semester</label>
                        <select name="semester" required>
                            <option value="1st">Semester 1</option>
                            <option value="2nd">Semester 2</option>
                            <option value="3rd">Semester 3</option>
                            <option value="4th">Semester 4</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Department</label>
                        <select name="dept" required>
                            <option value="Computer">Computer</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                            <option value="Electrical">Electrical</option>
                            <option value="AI/DS">AI/DS</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Division</label>
                        <select name="div" required>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn primary-btn" style="background: linear-gradient(90deg, #10b981, #059669);">Create Account</button>
            </form>
            
            <p style="text-align:center; margin-top:20px;">
                Already have an account? <a href="/student/login" style="color:var(--accent);">Login here</a>
            </p>
        </main>
    </div>
</body>
</html>
